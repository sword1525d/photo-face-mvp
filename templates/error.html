{% extends "base.html" %}
{% block title %}{{ title }} · {{ app_name }}{% endblock %}

{% block content %}
<section class="section">
  <div class="empty-state error-state">
    <p class="error-code">{{ code }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="form-actions">
      <a class="btn btn-primary" href="{{ url_for('index') }}">Voltar ao início</a>
      {% if session.get('admin') %}
        <a class="btn btn-ghost" href="{{ url_for('admin_index') }}">Ir para o painel</a>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
